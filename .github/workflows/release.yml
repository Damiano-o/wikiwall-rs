name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilazione release
        run: cargo build --release --locked
      - name: Pacchetto
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\wikiwall.exe dist\wikiwall.exe
          Copy-Item README.md, LICENSE dist\
          Compress-Archive -Path dist\* -DestinationPath "wikiwall-${{ github.ref_name }}-windows-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: wikiwall-*-windows-x64.zip
          generate_release_notes: true
