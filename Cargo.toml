[package]
name = "wikiwall"
version = "0.1.0"
edition = "2021"
description = "Una voce di qualità di Wikipedia italiano sul tuo desktop Windows (port Rust)"
license = "MIT"
authors = ["Michele.Damiano"]

[[bin]]
name = "wikiwall"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "native-tls",
    "json",
] }
rand = "0.8"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
tungstenite = "0.24"
chrono = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
